# Stack-tuning experiment: base learners frozen at their modal picks from nested
# run 20261024T222443Z-ab130441 (AP tuning); only the meta-learner is tuned.
# Picking these after seeing every outer fold leaks a little, so scores from this
# config compare stack variants with each other. Do not ship from it: run the
# packaged config (fully tuned) before training a model to serve.
config_version: 1
seed: 42
objective:
  metric: average_precision
  min_precision: 0.95
  threshold_resamples: 200
  weighted_metrics: false
selection:
  strategy: best
  metric: average_precision
  score_source: nested_evaluation
  candidates:
  - stack
  - lightgbm
  - catboost
  - extra_trees
cv:
  outer_folds: 5
  inner_folds: 3
  min_outer_folds: 3
  min_inner_folds: 2
  final_oof_folds: 3
  shuffle: true
bootstrap:
  n_resamples: 1000
  confidence_level: 0.95
permutation_importance:
  n_repeats: 10
  metric: average_precision
calibration:
  n_bins: 10
models:
  extra_trees:
    n_candidates: 1
    fixed:
      n_estimators: 500
      class_weight: null
      n_jobs: 1
    grid:
      max_depth:
      - null
      min_samples_leaf:
      - 1
      max_features:
      - sqrt
  lightgbm:
    n_candidates: 1
    fixed:
      objective: binary
      subsample_freq: 1
      verbose: -1
      n_jobs: 1
      deterministic: true
      force_row_wise: true
    grid:
      learning_rate:
      - 0.05
      max_depth:
      - 7
      num_leaves:
      - 31
      n_estimators:
      - 400
      min_child_samples:
      - 30
      subsample:
      - 0.85
      colsample_bytree:
      - 1.0
      reg_alpha:
      - 0.0
      reg_lambda:
      - 0.1
  catboost:
    n_candidates: 1
    fixed:
      loss_function: Logloss
      verbose: false
      allow_writing_files: false
      thread_count: 1
    grid:
      depth:
      - 8
      iterations:
      - 300
      learning_rate:
      - 0.08
      l2_leaf_reg:
      - 3.0
      random_strength:
      - 1.0
meta:
  n_candidates: 4
  C: 100
  solver: lbfgs
  max_iter: 5000
  class_weight: null
  grid:
    C:
    - 0.1
    - 1
    - 10
    - 100
