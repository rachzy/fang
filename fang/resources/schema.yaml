# Bump `schema_version` whenever `feature_columns` or `known_columns` change
schema_version: 3

target_column: candidate_label
status_column: detection_status

label_mapping:
  CONFIRMED: 1
  FALSE-POSITIVE: 0

# Labels with no catalogue verdict: dropped for training, scored at prediction
unlabelled_values:
  - UNKNOWN

valid_statuses:
  - accepted
  - rejected
  - provisional
  - harmonic_duplicate

# Only these columns will reach a model
feature_columns:
  - period_days
  - duration_hours
  - scale_mean
  - scale_std
  - local_noise
  - depth_stability
  - acf_lag_1h
  - acf_lag_3h
  - acf_lag_6h
  - acf_lag_12h
  - acf_lag_24h
  - cadence_hours
  - depth_mean_per_transit
  - depth_std_per_transit
  - npts_transit_median
  - cdpp_3h
  - cdpp_6h
  - cdpp_12h
  - SES_mean
  - SES_std
  - MES
  - max_ses
  - max_mes
  - snr_global
  - resid_rms_global
  - vshape_metric
  - secondary_depth
  - secondary_depth_snr
  - secondary_depth_snr_log
  - secondary_depth_snr_capped
  - odd_even_depth_ratio
  - ingress_egress_asymmetry
  - skewness_flux
  - kurtosis_flux
  - outlier_resistance
  - planet_radius_rearth
  # Eclipsing-binary and stellar-density checks (Shaula, 2026-10-27)
  - log_rho_ratio
  - even_odd_depth_diff_sigma
  - secondary_max_snr_any_phase
  - secondary_phase
  - secondary_depth_ratio

# Columns that are present in the processed CSVs but deliberately excluded from every model
excluded_columns:
  supervision:
    - candidate_label
    - detection_status
    - matched_target
    - matched_period_ratio
    - fp_source
  pipeline_control:
    - mes_threshold_used
    - is_provisional_detection
    # Number of phase positions the secondary scan tried; set by the scan, not the signal
    - secondary_scan_trials
  stellar_context:
    # Built from catalogue stellar mass and luminosity; they describe the host more than the
    # signal, and KOI false-positive stars differ from planet hosts by how targets were chosen
    - semi_major_axis_au
    - orbital_speed_kms
    - insolation_earth
    - equilibrium_temp_k
  non_generalizable:
    - t0
  alias:
    # Duplicates
    - duration_days
    - scale_skewness
    - scale_kurtosis
    - scale_outlier_resistance
    - snr_per_transit_mean
    - snr_per_transit_std
    - planet_radius_rjup
    # log_rho_ratio carries it, divided by the catalogue density
    - rho_star_transit

# Columns required to be present in every input file, per CLI mode.
required_columns:
  train:
    - candidate_label
    - detection_status
  predict: []
